<div th:fragment="header">
<header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0 shadow-2xs z-20">
            <div>
                <h1 id="header-title" class="text-lg font-bold text-slate-900 leading-tight" th:text="${pageTitle}">Scraper Studio</h1>
                <p id="header-subtitle" class="text-xs text-slate-500" th:text="${pageSubtitle}">Configure parameters, run automated scrapers & monitor real-time telemetry</p>
            </div>

            <!-- Top Actions & Live Status -->
            <div class="flex items-center space-x-3">
                <!-- Global API Key Quick Pill -->
                <button onclick="openApiKeyModal()" class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-blue-50/80 hover:bg-blue-100/80 border border-blue-200 text-xs font-semibold text-blue-800 transition group" title="Click to manage Global API Key">
                    <i class="fa-solid fa-key text-blue-600 group-hover:rotate-45 transition-transform"></i>
                    <span>Key:</span>
                    <span id="header-api-key-preview" class="font-mono text-blue-600 font-bold">579b464d...</span>
                    <i class="fa-solid fa-pen-to-square text-[10px] text-blue-500"></i>
                </button>

                <div id="sse-status-indicator" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-50 text-xs font-semibold text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-live"></span>
                    <span id="sse-status-text">SSE Live Stream Connected</span>
                </div>

                <div class="flex items-center space-x-2">
                    <a href="/tester" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center space-x-1.5 border border-slate-200">
                        <i class="fa-solid fa-terminal text-blue-600"></i>
                        <span>Live Runner</span>
                    </a>
                    <a href="/api/resources/export/json" download="data_gov_apis.json" class="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-sm shadow-blue-500/25">
                        <i class="fa-solid fa-file-export"></i>
                        <span>Export JSON</span>
                    </a>
                </div>
            </div>
        </header>
</div>
