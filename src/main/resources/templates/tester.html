<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::section})}">
<body>
<section>
    <!-- =================================================================================== -->
    <!-- TAB 3: LIVE API RUNNER -->
    <!-- =================================================================================== -->
    <div id="tab-content-tester" class="space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left: Request Builder -->
            <div class="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 card-shadow space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <div>
                        <h2 class="text-base font-bold text-slate-900 flex items-center space-x-2">
                            <i class="fa-solid fa-terminal text-blue-600"></i>
                            <span>Live API Runner</span>
                        </h2>
                        <p class="text-xs text-slate-500 mt-0.5">Test any Data.gov.in resource directly</p>
                    </div>
                </div>

                <form onsubmit="event.preventDefault(); runApiTest();" class="space-y-4">
                    <!-- Resource ID -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">
                            Resource ID / Index Name <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="test-resource-id" required placeholder="e.g. resource_xxx..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-mono text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>

                    <!-- Filter Parameters -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">
                            Filter Query (Optional)
                        </label>
                        <div class="flex space-x-2 mb-2">
                            <input type="text" id="test-filter-key" placeholder="Field name" class="w-1/2 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" id="test-filter-val" placeholder="Value" class="w-1/2 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <!-- Limit/Offset -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Limit</label>
                            <input type="number" id="test-limit" value="10" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Offset</label>
                            <input type="number" id="test-offset" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100">
                        <button type="submit" id="btn-run-test" class="w-full py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white shadow-md shadow-blue-500/25 transition-all flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-play"></i>
                            <span>Execute Request</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Right: JSON Response Viewer -->
            <div class="lg:col-span-7 space-y-5 flex flex-col">
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 card-shadow flex-1 flex flex-col h-[600px]">
                    <div class="flex items-center justify-between pb-3 mb-2 border-b border-slate-800 text-xs">
                        <div class="flex items-center space-x-2 text-slate-200 font-semibold">
                            <i class="fa-solid fa-code text-blue-400"></i>
                            <span>JSON Response Payload</span>
                        </div>
                        <div class="flex space-x-2">
                            <span id="test-status" class="px-2 py-1 bg-slate-800 text-slate-400 rounded-md font-mono text-[10px]">HTTP --</span>
                            <button onclick="copyTestResponse()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <!-- JSON Editor / Viewer area -->
                    <div class="flex-1 bg-slate-950 rounded-xl p-4 overflow-y-auto border border-slate-800/80">
                        <pre id="test-response-viewer" class="text-xs font-mono text-emerald-400 whitespace-pre-wrap word-break">
// Waiting for request...
// The JSON response will appear here.
                        </pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Tester Page Specific Logic -->
    <script src="/js/tester.js"></script>
</section>
</body>
</html>
