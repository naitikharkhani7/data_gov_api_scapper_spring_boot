<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::section})}">
<body>
<section>
    <!-- =================================================================================== -->
    <!-- TAB 2: API CATALOG & EXPLORER -->
    <!-- =================================================================================== -->
    <div id="tab-content-catalog" class="space-y-6">
        <!-- Top Toolbar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow space-y-3">
            
            <!-- Top Row: Search & Filters -->
            <div class="flex flex-wrap items-center gap-2.5">
                <!-- Search Input -->
                <div class="relative flex-1 min-w-[220px]">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </div>
                    <input type="text" id="catalog-search" placeholder="Search title, ministry, resource ID..." class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" onkeyup="filterCatalog()">
                </div>
                
                <!-- State Filter -->
                <select id="catalog-state-filter" class="w-full sm:w-44 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" onchange="filterCatalog()">
                    <option value="ALL">All States / UTs</option>
                    <th:block th:each="st : ${states}">
                        <option th:value="${st}" th:text="${st}"></option>
                    </th:block>
                </select>

                <!-- Sector Filter -->
                <select id="catalog-sector-filter" class="w-full sm:w-52 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" onchange="filterCatalog()">
                    <option value="ALL">All Sectors</option>
                    <th:block th:each="s : ${sectors}">
                        <option th:value="${s.name}" th:text="${s.name + ' (' + s.count + ')'}"></option>
                    </th:block>
                </select>

                <!-- Org Type Filter -->
                <select id="catalog-orgtype-filter" class="w-full sm:w-36 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" onchange="filterCatalog()">
                    <option value="ALL">All Govt Types</option>
                    <option value="central">Central Govt</option>
                    <option value="state">State Govt</option>
                </select>

                <!-- Year Filter -->
                <select id="catalog-year-filter" class="w-full sm:w-32 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" onchange="filterCatalog()">
                    <option value="ALL">All Years</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                    <option value="2018">2018</option>
                    <option value="2017">2017</option>
                    <option value="2016">2016</option>
                    <option value="2015">2015</option>
                    <option value="2014">2014</option>
                </select>

                <!-- Sort -->
                <select id="catalog-sort" class="w-full sm:w-36 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-medium text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" onchange="filterCatalog()">
                    <option value="id,desc">Latest First</option>
                    <option value="id,asc">Oldest First</option>
                    <option value="title,asc">Title (A - Z)</option>
                    <option value="title,desc">Title (Z - A)</option>
                </select>

                <!-- Reset Button -->
                <button type="button" onclick="resetCatalogFilters()" class="px-3 py-2.5 rounded-xl bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 text-xs font-bold transition flex items-center space-x-1 border border-slate-200 cursor-pointer" title="Reset all active filters">
                    <i class="fa-solid fa-rotate-left text-[10px]"></i>
                    <span>Reset</span>
                </button>
            </div>

            <!-- View Mode & Total Header -->
            <div class="flex items-center space-x-3 shrink-0">
                <span id="catalog-count-header" class="text-xs font-bold text-slate-500 hidden md:inline-block">Loading...</span>
                <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button onclick="setCatalogView('grid')" id="btn-view-grid" class="p-1.5 px-3 rounded-lg bg-white shadow-2xs text-blue-600 font-bold text-xs transition flex items-center space-x-1.5 cursor-pointer">
                        <i class="fa-solid fa-grid-2 text-xs"></i> <span>Cards</span>
                    </button>
                    <button onclick="setCatalogView('list')" id="btn-view-list" class="p-1.5 px-3 rounded-lg text-slate-500 hover:text-slate-900 font-bold text-xs transition flex items-center space-x-1.5 cursor-pointer">
                        <i class="fa-solid fa-list text-xs"></i> <span>List</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Catalog Container (Dynamic JS Rendering) -->
        <div id="catalog-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 min-h-[420px]">
            <!-- Loading Skeleton Placeholder -->
            <div id="catalog-center-loader" class="col-span-full py-28 flex flex-col items-center justify-center text-center bg-white/70 backdrop-blur-sm rounded-2xl border border-slate-200 shadow-xs">
                <div class="relative flex items-center justify-center mb-4">
                    <div class="w-16 h-16 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
                    <i class="fa-solid fa-database text-blue-600 text-base absolute"></i>
                </div>
                <h3 class="text-slate-900 font-bold text-base">Loading Government Datasets...</h3>
                <p class="text-slate-500 text-xs mt-1">Fetching records from local database</p>
                <div class="mt-4 px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-[11px] font-mono font-semibold">
                    <i class="fa-solid fa-bolt mr-1"></i> Fast Database Query
                </div>
            </div>
        </div>

        <!-- Comprehensive Pagination Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow flex flex-col xl:flex-row items-center justify-between gap-4">
            <!-- Left Info & Per Page -->
            <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600 font-medium">
                <div>
                    Showing <span id="pag-showing-start" class="font-bold text-slate-900 font-mono">1</span> to 
                    <span id="pag-showing-end" class="font-bold text-slate-900 font-mono">9</span> of 
                    <span id="pag-total-items" class="font-bold text-blue-600 font-mono">0</span> APIs
                </div>
                <div class="h-4 w-px bg-slate-200 hidden sm:block"></div>
                <div class="flex items-center space-x-1.5">
                    <span class="text-slate-500">Per page:</span>
                    <select id="catalog-page-size" onchange="changePageSize(this.value)" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs font-bold text-slate-700 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer">
                        <option value="27" selected>27 APIs</option>
                        <option value="54">54 APIs</option>
                        <option value="81">81 APIs</option>
                        <option value="108">108 APIs</option>
                    </select>
                </div>
            </div>
            
            <!-- Center Numeric Page Pills -->
            <div id="pag-number-pills" class="flex flex-wrap items-center justify-center gap-1.5">
                <!-- Dynamically rendered via catalog.js: [1] [2] [3] ... [20122] -->
            </div>

            <!-- Right Controls & Quick Jump -->
            <div class="flex flex-wrap items-center gap-2 shrink-0">
                <button type="button" id="pag-btn-prev" onclick="prevCatalogPage()" class="p-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition disabled:opacity-30 disabled:pointer-events-none flex items-center space-x-1 cursor-pointer">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                    <span>Prev</span>
                </button>
                <button type="button" id="pag-btn-next" onclick="nextCatalogPage()" class="p-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm shadow-blue-500/25 transition disabled:opacity-30 disabled:pointer-events-none flex items-center space-x-1 cursor-pointer">
                    <span>Next</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>

                <div class="h-4 w-px bg-slate-200 hidden sm:block"></div>

                <!-- Jump to page form -->
                <form onsubmit="jumpToPage(event)" class="flex items-center space-x-1">
                    <span class="text-xs text-slate-400">Go:</span>
                    <input type="number" id="pag-jump-input" min="1" placeholder="Page" class="w-16 px-2 py-1 text-xs font-mono font-bold bg-slate-50 border border-slate-200 rounded-lg text-center focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button type="submit" class="px-2.5 py-1 bg-slate-800 hover:bg-black text-white text-xs font-bold rounded-lg transition cursor-pointer">
                        Go
                    </button>
                </form>
            </div>
        </div>
    </div>
    <!-- Catalog Page Specific Logic -->
    <script src="/js/catalog.js"></script>
</section>
</body>
</html>
