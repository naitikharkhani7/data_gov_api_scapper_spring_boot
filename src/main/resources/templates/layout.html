<!DOCTYPE html>
<html lang="en" class="h-full" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data.gov.in API Scraper & Live Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome & Google Fonts (Inter + JetBrains Mono) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .pulse-live {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .card-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        }
        .card-shadow-hover:hover {
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.08), 0 8px 10px -6px rgba(37, 99, 235, 0.04);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex overflow-hidden antialiased selection:bg-blue-600 selection:text-white">

    <!-- =================================================================================== -->
    <!-- LEFT SIDEBAR (White & Blue Theme) -->
    <!-- =================================================================================== -->
    
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50">
        <div th:replace="~{fragments/header :: header}"></div>
        <!-- Main Scrollable Content Area -->
        <main class="flex-1 overflow-y-auto p-8 space-y-6">
<!-- Top 4 KPI Metrics Cards (White & Blue Palette) -->
            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                <!-- Card 1 -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/90 card-shadow hover:border-blue-300 card-shadow-hover transition group">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Scraped in Local DB</span>
                        <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-base group-hover:scale-110 transition">
                            <i class="fa-solid fa-database"></i>
                        </div>
                    </div>
                    <div class="text-3xl font-extrabold text-slate-900 mt-2 flex items-baseline space-x-1.5">
                        <span id="stat-total-saved">0</span>
                        <span class="text-xs font-semibold text-blue-600">APIs</span>
                    </div>
                    <div class="text-xs text-slate-500 mt-2 flex items-center">
                        <i class="fa-solid fa-circle-check text-emerald-500 mr-1.5"></i> Persistent H2 Database
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/90 card-shadow hover:border-blue-300 card-shadow-hover transition group">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Available Sectors</span>
                        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-base group-hover:scale-110 transition">
                            <i class="fa-solid fa-chart-pie"></i>
                        </div>
                    </div>
                    <div class="text-3xl font-extrabold text-indigo-600 mt-2">
                        <span id="stat-sectors-count" th:text="${sectors != null ? sectors.size() : 0}">0</span>
                    </div>
                    <div class="text-xs text-slate-500 mt-2 flex items-center">
                        <i class="fa-solid fa-globe text-blue-500 mr-1.5"></i> data.gov.in taxonomy
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/90 card-shadow hover:border-blue-300 card-shadow-hover transition group">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Scraper Engine State</span>
                        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-base group-hover:scale-110 transition">
                            <i class="fa-solid fa-gauge-high"></i>
                        </div>
                    </div>
                    <div class="mt-2 flex items-center space-x-2">
                        <span id="stat-status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">
                            IDLE
                        </span>
                        <span id="stat-speed" class="text-xs text-emerald-600 font-mono font-bold">0 req/min</span>
                    </div>
                    <div class="text-xs text-slate-500 mt-2 truncate font-medium" id="stat-current-action">
                        Engine idle
                    </div>
                </div>

                <!-- Card 4 -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/90 card-shadow hover:border-blue-300 card-shadow-hover transition group">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Global API Key</span>
                        <div class="w-9 h-9 rounded-xl bg-cyan-50 text-cyan-600 flex items-center justify-center text-base group-hover:scale-110 transition">
                            <i class="fa-solid fa-key"></i>
                        </div>
                    </div>
                    <div id="stat-key-title" class="text-sm font-bold text-slate-800 mt-2 truncate font-mono">
                        579b464d...
                    </div>
                    <div class="text-xs text-slate-500 mt-2 flex items-center justify-between">
                        <span id="stat-key-status">Default Sample Key</span>
                        <button onclick="openApiKeyModal()" class="text-blue-600 font-bold hover:underline">Change Key</button>
                    </div>
                </div>
            </section>

            
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>
    <div th:replace="~{fragments/modals :: modals}"></div>
<!-- Common Shared Logic -->
    <script src="/js/common.js"></script>
</body>
</html>
